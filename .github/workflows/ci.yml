name: CI

# Runs on every pull request (and every push to a PR branch). On pushes to main it runs as
# the first stage of deploy.yml, so main is never deployed without passing CI.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  service:
    name: ${{ matrix.service }} service
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [games, insights]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Tests with coverage (fails below 70%)
        run: pytest --cov --cov-report=term --cov-report=xml --cov-fail-under=70
      - name: Dependency audit
        run: pip-audit -r requirements.txt --strict
      - name: Build image
        run: docker build -t chess-habits-${{ matrix.service }}:ci .

  ui:
    name: ui
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Tests with coverage
        run: npm run test:coverage
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Build
        run: npm run build

  infra:
    name: infra (Bicep build + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Bicep
        run: az bicep install
      - name: Build
        run: az bicep build --file infra/main.bicep --stdout > /dev/null
      - name: Lint (warnings fail the job)
        run: |
          az bicep lint --file infra/main.bicep 2>&1 | tee lint.txt
          # lint exits 0 on warnings; fail on its diagnostics, not on az CLI notices
          ! grep -Eq '\) : (Warning|Error) ' lint.txt

  compose:
    name: compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Throwaway local SQL password (CI only, never stored)
        run: echo "MSSQL_SA_PASSWORD=Ci$(openssl rand -hex 12)Xy7" > .env
      - name: Start the whole system
        run: docker compose up -d --build
      - name: Wait for both services
        run: |
          for i in $(seq 1 60); do
            if curl -fsS localhost:8001/health && curl -fsS localhost:8002/health; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Smoke test
        run: |
          set -e
          curl -fsS localhost:8001/players | grep -q '^\[\]$'
          # insights -> games over HTTP: unknown player must come back as 404
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8002/players/999/runs)
          test "$code" = "404"
          curl -fsS localhost:5173/ | grep -q '<title>Chess Habits</title>'
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop
        if: always()
        run: docker compose down -v
