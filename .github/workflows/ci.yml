name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  service:
    name: ${{ matrix.service }} service
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [games, insights]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Tests with coverage (fails below 70%)
        run: pytest --cov --cov-report=term --cov-report=xml --cov-fail-under=70
      - name: Dependency audit
        run: pip-audit -r requirements.txt --strict
      - name: Build image
        run: docker build -t kiebitz-${{ matrix.service }}:ci .

  ui:
    name: ui
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Tests with coverage
        run: npm run test:coverage
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Build
        run: npm run build
