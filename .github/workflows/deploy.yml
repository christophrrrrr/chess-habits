name: Deploy

# On every merge to main: CI -> push images (tagged with the commit SHA) -> update both
# Container Apps -> wait until /health answers 200 on the new revision -> build and deploy the
# UI to Static Web Apps -> smoke test the live URLs. Any failing step stops the pipeline.
#
# Azure steps run only when the repository variable AZURE_ENABLED is "true", so main stays
# green before the group's Azure credentials exist. Setup: docs/deployment.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/kiebitz

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  images:
    name: push ${{ matrix.service }} image
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [games, insights]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: services/${{ matrix.service }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  services:
    name: deploy services
    needs: images
    if: vars.AZURE_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    outputs:
      games_url: ${{ steps.urls.outputs.games_url }}
      insights_url: ${{ steps.urls.outputs.insights_url }}
    env:
      RG: ${{ vars.AZURE_RESOURCE_GROUP }}
      PREFIX: ${{ vars.AZURE_PREFIX }}
    steps:
      - uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Update container apps to this commit's images
        run: |
          for svc in games insights; do
            az containerapp update --name "$PREFIX-$svc" --resource-group "$RG" \
              --image "$IMAGE_PREFIX-$svc:${{ github.sha }}" --output none
          done
      - id: urls
        name: Look up service URLs
        run: |
          for svc in games insights; do
            fqdn=$(az containerapp show -n "$PREFIX-$svc" -g "$RG" --query properties.configuration.ingress.fqdn -o tsv)
            echo "${svc}_url=https://$fqdn" >> "$GITHUB_OUTPUT"
          done
      - name: Wait for healthy new revisions (fails after 5 minutes)
        run: |
          check() {
            local svc=$1 url=$2
            local state
            state=$(az containerapp show -n "$PREFIX-$svc" -g "$RG" \
              --query "[properties.latestRevisionName, properties.latestReadyRevisionName]" -o tsv | tr '\t' ' ')
            set -- $state
            [ "$1" = "$2" ] && [ "$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$url/health")" = "200" ]
          }
          for i in $(seq 1 30); do
            if check games "${{ steps.urls.outputs.games_url }}" && check insights "${{ steps.urls.outputs.insights_url }}"; then
              echo "both services healthy"; exit 0
            fi
            echo "waiting ($i/30)"; sleep 10
          done
          echo "::error::services did not become healthy within 5 minutes"; exit 1

  ui:
    name: deploy ui
    needs: services
    runs-on: ubuntu-latest
    environment: production
    env:
      RG: ${{ vars.AZURE_RESOURCE_GROUP }}
      PREFIX: ${{ vars.AZURE_PREFIX }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build
        working-directory: ui
        env:
          VITE_GAMES_API_URL: ${{ needs.services.outputs.games_url }}
          VITE_INSIGHTS_API_URL: ${{ needs.services.outputs.insights_url }}
        run: npm ci && npm run build
      - uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - id: swa
        name: Get Static Web Apps deployment token
        run: |
          token=$(az staticwebapp secrets list -n "$PREFIX-ui" -g "$RG" --query properties.apiKey -o tsv)
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
          echo "url=https://$(az staticwebapp show -n "$PREFIX-ui" -g "$RG" --query defaultHostname -o tsv)" >> "$GITHUB_OUTPUT"
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa.outputs.token }}
          action: upload
          app_location: ui/dist
          skip_app_build: true
          skip_api_build: true
      - name: Smoke test the live system
        run: |
          set -e
          for i in $(seq 1 12); do curl -fsS "${{ steps.swa.outputs.url }}" | grep -q '<title>Kiebitz</title>' && break; sleep 10; done
          curl -fsS "${{ steps.swa.outputs.url }}" | grep -q '<title>Kiebitz</title>'
          curl -fsS "${{ needs.services.outputs.games_url }}/players" > /dev/null
          curl -fsS "${{ needs.services.outputs.insights_url }}/analyses" | grep -q tilt
          echo "### Live: ${{ steps.swa.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
