name: Infrastructure

# Manual: creates or updates all Azure resources from infra/main.bicep inside the group's
# existing resource group. Run once after the group's managed identity is ready (and after the first
# Deploy run has pushed images), and again whenever infra/main.bicep changes.

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to start the container apps with
        default: latest

permissions:
  contents: read
  id-token: write # OIDC sign-in as the group's managed identity

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy infra/main.bicep
        env:
          IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/chess-habits
          SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          az deployment group create \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "chess-habits-${{ github.run_number }}" \
            --template-file infra/main.bicep \
            --parameters \
              prefix="${{ vars.AZURE_PREFIX }}" \
              sqlAdminLogin="${{ vars.SQL_ADMIN_LOGIN }}" \
              sqlAdminPassword="$SQL_ADMIN_PASSWORD" \
              gamesImage="$IMAGE_PREFIX-games:${{ inputs.image_tag }}" \
              insightsImage="$IMAGE_PREFIX-insights:${{ inputs.image_tag }}" \
              registryUsername="${{ secrets.GHCR_PULL_TOKEN != '' && github.repository_owner || '' }}" \
              registryPassword="$GHCR_PULL_TOKEN" \
            --query properties.outputs -o json | tee outputs.json
          {
            echo "### Deployed"
            echo '```json'; cat outputs.json; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
